<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobrecarga · Panel del entrenador</title>
<style>
#app a{color:#FF7A3D}
:root{--bg:#0f141a;--card:#161c23;--line:#262e37;--ink:#e8ecf0;--muted:#8a939d;--acc:#e2571c;--ok:#3f9d5a;--warn:#d9a13b;--bad:#d9483b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:18px}h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.small{font-size:13px}
input,select,textarea{background:#0c1116;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 10px;font:inherit;width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
button,.btn{background:#222a33;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer;text-decoration:none}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}button.sm{padding:5px 9px;font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#222a33}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
tr.cl{cursor:pointer}tr.cl:hover{background:#1b222a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}@media(max-width:640px){.grid{grid-template-columns:1fr 1fr}}
.kpi{background:#0c1116;border:1px solid var(--line);border-radius:12px;padding:10px}.kpi b{display:block;font-size:22px}
.ses{border-top:1px solid var(--line);padding:10px 0}.ses:first-child{border-top:0}.err{color:var(--bad)}
@media(max-width:640px){.hide-m{display:none}}
.vrow{padding:10px 0;border-top:1px solid var(--line,#2a2f36);display:flex;flex-direction:column;gap:6px}.vname{display:flex;flex-direction:column}
</style></head><body><main id="app"></main>
<script>
/* Configuración: pega aquí la URL y la clave pública (anon) de tu proyecto de Supabase */
const CFG={url:'https://yqtxopjspriaqwvqklql.supabase.co',key:'sb_publishable_ODFqeqHzh2Jv3A0QJI293g_LiqVOhJB'};
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=()=>CFG.url?CFG:(JSON.parse(localStorage.getItem('pn.cfg')||'null')||{url:'',key:''});
const st={clients:[],sel:null,ses:[],err:'',filter:'todos'};
const sesn=()=>JSON.parse(localStorage.getItem('pn.sb')||'null');
async function auth(body,grant){const c=cfg(),r=await fetch(c.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||'Error al entrar');const x={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,uid:j.user.id,email:j.user.email};localStorage.setItem('pn.sb',JSON.stringify(x));return x}
async function tok(){let x=sesn();if(!x)return null;if(Date.now()>x.exp){try{x=await auth({refresh_token:x.rt},'refresh_token')}catch(e){localStorage.removeItem('pn.sb');setTimeout(()=>{render();alert('Tu sesión venció. Vuelve a entrar y publica otra vez.')},0);throw new Error('Tu sesión venció. Vuelve a entrar.')}}return x}
async function req(path,opt={}){const c=cfg(),x=await tok();const r=await fetch(c.url+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({apikey:c.key,Authorization:'Bearer '+x.at,'Content-Type':'application/json',Prefer:'return=representation'},opt.headers||{})}));
  if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
const hoy=()=>new Date().toISOString().slice(0,10);
const fmtD=d=>d?new Date(d+(d.length===10?'T12:00':'')).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}):'–';
const dias=ts=>ts?Math.floor((Date.now()-new Date(ts).getTime())/864e5):null;
const prueba=p=>!!(p.prueba_hasta&&p.activo_hasta===p.prueba_hasta);
function estado(p){if(p.rol==='coach')return['Entrenador','ok'];if(!p.activo_hasta)return['Por activar','warn'];if(prueba(p))return p.activo_hasta>=hoy()?['Prueba hasta '+fmtD(p.activo_hasta),'warn']:['Prueba terminada','bad'];return p.activo_hasta>=hoy()?['Activo hasta '+fmtD(p.activo_hasta),'ok']:['Vencido '+fmtD(p.activo_hasta),'bad']}
async function cargar(){st.err='';try{
  const ps=await req('profiles?select=*&order=creado.desc');st.all=ps;
  const ss=await req('sesiones?select=user_id,ts,data->fb,data->skipped&order=ts.desc&limit=2000');
  st.clients=ps.filter(p=>p.rol!=='coach').map(p=>{const mine=ss.filter(s=>s.user_id===p.id),last=mine[0],wk=mine.filter(s=>dias(s.ts)<=7&&!s.skipped).length;
    const fb=mine.slice(0,4).map(s=>s.fb).filter(Boolean),avg=k=>{const v=fb.map(f=>+f[k]).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
    const al=[];const d=last?dias(last.ts):null;if(p.activo_hasta&&p.activo_hasta>=hoy()&&(d==null||d>7))al.push('Sin entrenar '+(d==null?'aún':d+' días'));
    const fa=avg('fatigue'),jo=avg('joints');if(fa!=null&&fa>=4)al.push('Fatiga alta');if(jo!=null&&jo>=2)al.push('Molestias');
    if(p.activo_hasta&&p.activo_hasta>=hoy()&&dias(p.activo_hasta)>-5)al.push('Vence pronto');
    return Object.assign({},p,{last:last&&last.ts,wk,total:mine.length,al})});
  try{st.bajas=await req('bajas?select=*&order=creado.desc&limit=50')}catch(e){st.bajas=null}
  }catch(e){st.err=e.message}render()}
async function bajaVista(){localStorage.setItem('pn.bajasV',String(Date.now()));render()}
async function bajaQuitar(id){try{await req('bajas?id=eq.'+id,{method:'DELETE'});st.bajas=(st.bajas||[]).filter(b=>b.id!==id)}catch(e){st.err=e.message}render()}
async function extender(id,m){const p=st.clients.find(x=>x.id===id),base=p.activo_hasta&&p.activo_hasta>=hoy()?new Date(p.activo_hasta+'T12:00'):new Date();base.setMonth(base.getMonth()+m);
  await req('profiles?id=eq.'+id,{method:'PATCH',body:JSON.stringify({activo_hasta:base.toISOString().slice(0,10),prueba_hasta:null})});
  st.msg='';if(p.referido_por&&!p.ref_premiado){const r=st.all.find(x=>x.id===p.referido_por);if(r){const b=r.activo_hasta&&r.activo_hasta>=hoy()?new Date(r.activo_hasta+'T12:00'):new Date();b.setMonth(b.getMonth()+1);
    await req('profiles?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({activo_hasta:b.toISOString().slice(0,10),prueba_hasta:null})});await req('profiles?id=eq.'+id,{method:'PATCH',body:JSON.stringify({ref_premiado:true})});
    st.msg='Listo. Como lo invitó '+(r.nombre||r.email)+', a esa persona se le sumó 1 mes gratis.'}}
  await cargar()}
async function pausar(id){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);await req('profiles?id=eq.'+id,{method:'PATCH',body:JSON.stringify({activo_hasta:y})});await cargar()}
async function guardarNota(id){const n=$('#nn').value,no=$('#nt').value;await req('profiles?id=eq.'+id,{method:'PATCH',body:JSON.stringify({nombre:n,nota:no})});await cargar();abrir(id)}
async function abrir(id){st.sel=id;st.msg='';st.ses=[];render();try{st.ses=await req('sesiones?user_id=eq.'+id+'&select=data,ts&order=ts.desc&limit=40');const a=await req('app_state?user_id=eq.'+id+'&select=data');st.app=a&&a[0]?a[0].data:null}catch(e){st.err=e.message}render()}

/* v92: días a la medida y ajustes del coach sobre el plan automático (profiles.ajustes) */
const NIVN={novato:'Novato',intermedio:'Intermedio',avanzado:'Avanzado'},MUS=[['pecho','Pecho'],['espalda','Espalda'],['hombros','Hombros'],['biceps','Bíceps'],['triceps','Tríceps'],['cuadriceps','Cuádriceps'],['isquios','Isquiotibiales'],['gluteos','Glúteos'],['pantorrillas','Pantorrillas']];
const exN=id=>{const e=EXL.find(x=>x[0]===id);return e?e[1]:id};
async function darDias(id){const n=parseInt($('#dd').value,10);if(!(n>0&&n<=730)){st.msg='Escribe cuántos días (1 a 730).';render();return}
  const p=st.clients.find(x=>x.id===id),base=p.activo_hasta&&p.activo_hasta>=hoy()?new Date(p.activo_hasta+'T12:00'):new Date();base.setDate(base.getDate()+n);
  await req('profiles?id=eq.'+id,{method:'PATCH',body:JSON.stringify({activo_hasta:base.toISOString().slice(0,10),prueba_hasta:null})});await cargar();await abrir(id);st.msg='Se sumaron '+n+' días.';render()}
async function fijarFecha(id){const v=$('#df').value;if(!v){st.msg='Elige una fecha.';render();return}
  await req('profiles?id=eq.'+id,{method:'PATCH',body:JSON.stringify({activo_hasta:v,prueba_hasta:null})});await cargar();await abrir(id);st.msg='Acceso hasta el '+fmtD(v)+'.';render()}
function ajIni(p){const a=(p&&p.ajustes)||{};st.aj={dias:a.dias||'',tiempo:a.tiempo||'',nivel:a.nivel||'',spec:(a.spec||[]).slice(),avoid:(a.avoid||[]).slice(),swap:Object.assign({},a.swap||{}),nota:a.nota||''};st.ajFor=p.id;st.ajq='';st.ajq2='';st.ajFrom=''}
function ajBusca(q,act){q=(q||'').trim().toLowerCase();if(q.length<2)return '';const L=EXL.filter(e=>(e[1]+' '+e[2]).toLowerCase().includes(q)).slice(0,8);
  return L.map(e=>`<button class="sm" onclick="${act}('${e[0]}')">${esc(e[1])} <span class="muted small">${esc(e[2])}</span></button>`).join(' ')||'<span class="muted small">Sin resultados.</span>'}
function ajAvoid(id){if(!st.aj.avoid.includes(id))st.aj.avoid.push(id);st.ajq='';render()}
function ajFrom(id){st.ajFrom=id;st.ajq2='';render()}
function ajTo(id){if(st.ajFrom&&st.ajFrom!==id){st.aj.swap[st.ajFrom]=id}st.ajFrom='';st.ajq2='';render()}
function ajSpec(m){const L=st.aj.spec;st.aj.spec=L.includes(m)?L.filter(x=>x!==m):L.concat(m).slice(-3);render()}
async function ajGuardar(id){const a=st.aj;a.nota=(($('#ajn')||{}).value??a.nota??'').trim().slice(0,600);
  const out={ts:Date.now()};if(a.dias)out.dias=+a.dias;if(a.tiempo)out.tiempo=+a.tiempo;if(a.nivel)out.nivel=a.nivel;out.spec=a.spec;out.avoid=a.avoid;out.swap=a.swap;if(a.nota)out.nota=a.nota;
  try{await req('profiles?id=eq.'+id,{method:'PATCH',body:JSON.stringify({ajustes:out})});await cargar();ajIni(st.clients.find(x=>x.id===id));await abrir(id);st.msg='Ajustes guardados. Le llegan la próxima vez que abra la app (si está a media sesión, al terminarla).';render()}
  catch(e){st.msg='No se pudo guardar: '+e.message+(String(e.message).includes('ajustes')?' · ¿Ya corriste el script supabase-v92-ajustes.sql?':'');render()}}
function ajVista(p){if(!p.id)return "";if(!st.aj||st.ajFor!==p.id)ajIni(p);const a=st.aj,pr=(st.app&&st.app.profile)||{},sel=(k,opts,cur)=>`<select onchange="st.aj.${k}=this.value">${opts.map(([v,l])=>`<option value="${v}" ${String(cur)===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
  return `<div class="card"><h2>Ajustar su plan</h2><p class="muted small">Cambias lo que necesites y el plan automático se rehace con eso; sigue progresando solo. Lo que dejes en "Como lo tiene" no se toca.</p>
    <div class="row" style="align-items:flex-end;flex-wrap:wrap"><label>Días por semana${sel('dias',[['','Como lo tiene ('+(pr.dias||'–')+')'],...[2,3,4,5,6].map(n=>[n,n+' días'])],a.dias)}</label>
    <label>Tiempo por sesión${sel('tiempo',[['','Como lo tiene ('+(pr.tiempo||'–')+' min)'],...[30,45,60,75,90,120].map(n=>[n,n+' min'])],a.tiempo)}</label>
    <label>Nivel${sel('nivel',[['','Como lo tiene ('+(NIVN[pr.nivel]||'–')+')'],...Object.entries(NIVN)],a.nivel)}</label></div>
    <p class="small" style="margin:12px 0 4px"><b>Músculos prioritarios</b> <span class="muted">(máximo 3; reciben más series)</span></p><div class="row">${MUS.map(([k,n])=>`<button class="sm ${a.spec.includes(k)?'pri':''}" onclick="ajSpec('${k}')">${n}</button>`).join('')}</div>
    <p class="small" style="margin:12px 0 4px"><b>Ejercicios que no debe hacer</b></p><div class="row">${a.avoid.map(id=>`<span class="pill warn">${esc(exN(id))} <a href="#" onclick="event.preventDefault();st.aj.avoid=st.aj.avoid.filter(x=>x!=='${id}');render()">✕</a></span>`).join(' ')||'<span class="muted small">Ninguno.</span>'}</div>
    <input placeholder="Buscar ejercicio para quitar…" value="${esc(st.ajq||'')}" oninput="st.ajq=this.value;document.getElementById('ajr1').innerHTML=ajBusca(this.value,'ajAvoid')"><div id="ajr1" class="row">${ajBusca(st.ajq,'ajAvoid')}</div>
    <p class="small" style="margin:12px 0 4px"><b>Cambiar un ejercicio por otro</b> <span class="muted">(del mismo músculo para que cuente igual)</span></p><div>${Object.entries(a.swap).map(([o,n])=>`<div class="small">${esc(exN(o))} → <b>${esc(exN(n))}</b> <a href="#" onclick="event.preventDefault();delete st.aj.swap['${o}'];render()">quitar</a></div>`).join('')||'<span class="muted small">Ninguno.</span>'}</div>
    ${st.ajFrom?`<p class="small">Cambiar <b>${esc(exN(st.ajFrom))}</b> por: <a href="#" onclick="event.preventDefault();st.ajFrom='';render()">cancelar</a></p>`:''}
    <input placeholder="${st.ajFrom?'Buscar el ejercicio nuevo…':'Buscar el ejercicio a cambiar…'}" value="${esc(st.ajq2||'')}" oninput="st.ajq2=this.value;document.getElementById('ajr2').innerHTML=ajBusca(this.value,'${st.ajFrom?'ajTo':'ajFrom'}')"><div id="ajr2" class="row">${ajBusca(st.ajq2,st.ajFrom?'ajTo':'ajFrom')}</div>
    <label style="display:block;margin-top:12px">Mensaje para tu cliente (lo verá en Inicio)<textarea id="ajn" rows="2" maxlength="600" oninput="st.aj.nota=this.value">${esc(a.nota)}</textarea></label>
    <div class="row" style="margin-top:10px"><button class="pri" onclick="ajGuardar('${p.id}')">Guardar ajustes</button>${p.ajustes&&p.ajustes.ts?`<span class="muted small">Último ajuste: ${esc(new Date(p.ajustes.ts).toLocaleString('es-MX',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</span>`:''}</div></div>`}
async function subirApk(){const f=($('#apkf')||{}).files&&$('#apkf').files[0];if(!f){st.apk='Elige el archivo .apk.';render();return}
  if(!/\.apk$/i.test(f.name)||f.size<500000){st.apk='Ese archivo no parece el APK de la app.';render();return}
  st.apk='Subiendo…';render();
  try{const c=cfg(),x=await tok();const r=await fetch(c.url+'/storage/v1/object/app/Sobrecarga.apk',{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+x.at,'Content-Type':'application/vnd.android.package-archive','x-upsert':'true','cache-control':'no-cache'},body:f});
    if(!r.ok)throw new Error((await r.text().catch(()=>''))||('HTTP '+r.status));st.apk='Listo. El botón "Descargar" de tu página ya da esta versión.'}catch(e){st.apk='No se pudo subir: '+e.message}render()}
const DN={fisico:'Fisicoculturismo',power:'Powerlifting',street:'Streetlifting',cali:'Calistenia',general:'General'};
async function verPub(){try{const r=await fetch(cfg().url+'/storage/v1/object/public/app/version.json?t='+Date.now(),{cache:'no-store'});st.pub=r.ok?await r.json():null}catch(e){st.pub=null}render()}
async function publicar(){const f=$('#uf').files[0],notas=($('#un').value||'').trim();if(!f){st.upd='Elige primero el archivo index.html.';render();return}
  const t=await f.text();if(t.length<50000||t.indexOf('id="app"')<0||t.indexOf('config.js')<0){st.upd='Ese archivo no parece la app. Usa el index.html de la versión privada.';render();return}
  st.upd='Publicando…';render();
  try{const c=cfg(),x=await tok();const up=async(name,body,type)=>{const r=await fetch(c.url+'/storage/v1/object/app/'+name,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+x.at,'Content-Type':type,'x-upsert':'true','cache-control':'no-cache'},body});if(!r.ok)throw new Error((await r.text().catch(()=>''))||('HTTP '+r.status))};
    await up('index.html',t,'text/html; charset=utf-8');const v=Date.now();
    await up('version.json',JSON.stringify({v,notas,fecha:new Date().toISOString()}),'application/json');
    st.upd='Listo. Tus clientes verán "Versión nueva lista" la próxima vez que abran la app.';await verPub()}catch(e){st.upd='No se pudo publicar: '+e.message;render()}}
function vista(){const c=cfg();
  if(!c.url)return `<div class="card"><h1>Panel del entrenador</h1><p class="muted">Primera vez: pega los datos de tu proyecto de Supabase (Settings → API).</p>
    <div class="row" style="flex-direction:column;align-items:stretch"><label>URL del proyecto<input id="cu" placeholder="https://xxxx.supabase.co"></label><label>Clave pública (anon)<input id="ck"></label><button class="pri" onclick="localStorage.setItem('pn.cfg',JSON.stringify({url:$('#cu').value.trim().replace(/\\/$/,''),key:$('#ck').value.trim()}));render()">Guardar</button></div></div>`;
  if(!sesn())return `<div class="card" style="max-width:420px;margin:40px auto"><h1>Panel del entrenador</h1><p class="muted small">Entra con tu cuenta de entrenador.</p>
    <form onsubmit="event.preventDefault();auth({email:$('#le').value.trim(),password:$('#lp').value},'password').then(()=>{cargar();verPub()}).catch(e=>{st.err=e.message;render()})" style="display:grid;gap:10px">
    <label>Correo<input id="le" type="email" required></label><label>Contraseña<input id="lp" type="password" required></label>${st.err?`<div class="err small">${esc(st.err)}</div>`:''}<button class="pri">Entrar</button></form></div>`;
  if(st.sel){const p=st.clients.find(x=>x.id===st.sel)||{},pr=(st.app&&st.app.profile)||{},[et,ec]=estado(p);
    return `<div class="row between"><button onclick="st.sel=null;render()">← Clientes</button><button onclick="abrir('${p.id}')">Actualizar</button></div>
    <div class="card"><div class="row between"><h1>${esc(p.nombre||pr.nom||p.email)}</h1><span class="pill ${ec}">${esc(et)}</span></div><p class="muted small">${esc(p.email)}${p.codigo?' · código '+esc(p.codigo):''}${p.referido_por?' · invitado por '+esc(((st.all||[]).find(x=>x.id===p.referido_por)||{}).nombre||'otro cliente')+(p.ref_premiado?' (premio dado)':' (premio pendiente: se da al registrar su primer pago)'):''}${(st.all||[]).filter(x=>x.referido_por===p.id).length?' · ha invitado a '+(st.all||[]).filter(x=>x.referido_por===p.id).length:''}</p>
    ${st.msg?`<p class="small" style="color:var(--ok,#16794C)">${esc(st.msg)}</p>`:''}
    <div class="grid"><div class="kpi"><span class="muted small">Disciplina</span><b style="font-size:16px">${esc([pr.disc,pr.disc2].filter(Boolean).map(d=>DN[d]||d).join(' + ')||'–')}</b></div>
    <div class="kpi"><span class="muted small">Días / tiempo</span><b style="font-size:16px">${esc(pr.dias||'–')} días · ${esc(pr.tiempo||'–')} min</b></div>
    <div class="kpi"><span class="muted small">Sesiones (7 días)</span><b>${p.wk||0}</b></div><div class="kpi"><span class="muted small">Total sesiones</span><b>${p.total||0}</b></div></div>
    ${(p.al||[]).length?`<p>${p.al.map(a=>`<span class="pill warn">${esc(a)}</span>`).join(' ')}</p>`:''}
    <div class="row" style="margin-top:10px"><span class="muted small">Pagó:</span><button class="pri sm" onclick="extender('${p.id}',1)">1 mes</button><button class="sm" onclick="extender('${p.id}',3)">3 meses</button><button class="sm" onclick="extender('${p.id}',6)">6 meses</button><button class="sm" onclick="extender('${p.id}',12)">12 meses</button><button class="sm" onclick="pausar('${p.id}')">Pausar acceso</button></div>
    <div class="row" style="margin-top:8px;align-items:flex-end;flex-wrap:wrap"><label>Sumar días<input id="dd" type="number" min="1" max="730" placeholder="Ej. 15" style="width:110px"></label><button class="sm" onclick="darDias('${p.id}')">Sumar</button>
      <label>o acceso hasta<input id="df" type="date" value="${esc(p.activo_hasta||'')}"></label><button class="sm" onclick="fijarFecha('${p.id}')">Fijar fecha</button></div>

const nz=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
async function cargarVids(){try{const r=await req('videos?select=ex_id,url');st.vids={};(r||[]).forEach(x=>st.vids[x.ex_id]=x.url)}catch(e){st.vids=st.vids||{};st.verr='No pude leer los videos: '+e.message}vlist()}
function vlist(){const box=document.getElementById('vlist');if(!box)return;const V=st.vids||{},q=nz(st.vq||'');
  let L=EXL.filter(([id,n,m])=>(!q||nz(n).includes(q)||nz(m).includes(q))&&(!st.vsolo||V[id]));const tot=L.length;L=L.slice(0,30);
  box.innerHTML=(st.verr?`<p class="err small">${esc(st.verr)}</p>`:'')+`<p class="muted small">${Object.keys(V).length} ejercicios con video${q||st.vsolo?' · '+tot+' coinciden'+(tot>30?' (mostrando 30; escribe más para filtrar)':''):''}</p>`+
  L.map(([id,n,m])=>`<div class="vrow"><div class="vname"><b>${esc(n)}</b><span class="muted small">${esc(m)}${V[id]?' · <span style="color:var(--ok,#16794C)">con video</span>':''}</span></div>
    <div class="row" style="flex-wrap:nowrap;gap:6px"><input id="vin-${id}" placeholder="Pega aquí el enlace (https://…)" value="${esc(V[id]||'')}" style="flex:1;min-width:0">
    <button class="pri sm" onclick="vsave('${id}')">Guardar</button>${V[id]?`<button class="sm" onclick="vdel('${id}')">Quitar</button>`:''}</div>${st.vmsg&&st.vmsg.id===id?`<span class="small">${esc(st.vmsg.t)}</span>`:''}</div>`).join('')}
async function vsave(id){const el=document.getElementById('vin-'+id),url=(el&&el.value||'').trim();
  if(!/^https:\/\/\S+$/i.test(url)){st.vmsg={id,t:'El enlace debe empezar con https://'};vlist();return}
  try{await req('videos',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({ex_id:id,url})});st.vids[id]=url;st.vmsg={id,t:'Guardado. Tus clientes ya lo ven en "Ver video".'}}catch(e){st.vmsg={id,t:'No se pudo guardar: '+e.message}}vlist()}
async function vdel(id){try{await req('videos?ex_id=eq.'+encodeURIComponent(id),{method:'DELETE'});delete st.vids[id];st.vmsg={id,t:'Quitado. Vuelve a abrir la búsqueda de YouTube.'}}catch(e){st.vmsg={id,t:'No se pudo quitar: '+e.message}}vlist()}
function render(){$('#app').innerHTML=vista();if(document.getElementById('vlist')){if(!st.vids)cargarVids();else vlist()}}
