<style>
/* Dirección: sala de hierro. Negro grafito con sesgo azul, tiza para el texto y un solo acento brasa.

}

:root[data-theme="dark"]{
  --bg:#0B0E12; --surface:#141920; --raise:#1B222B; --ink:#F1EEE8; --muted:#8E99A6; --line:#252E39; --chip:#1D252F;
  --accent:#FF7A3D; --accent-ink:#1A0A02; --accent-soft:#38200F; --accent2:#4FD1DE;
  --ok:#54D69A; --ok-soft:#11301F; --warn:#F5CE55; --warn-soft:#382E10; --bad:#FF6B88; --bad-soft:#3D1A24;

@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-acc="rojo"]{--accent:#FF5A6E; --accent-ink:#1A0306; --accent-soft:#3A141B}:root:not([data-theme="light"])[data-acc="azul"]{--accent:#5C9DFF; --accent-ink:#04122B; --accent-soft:#14243F}:root:not([data-theme="light"])[data-acc="morado"]{--accent:#A98BFF; --accent-ink:#150838; --accent-soft:#251A44}:root:not([data-theme="light"])[data-acc="rosa"]{--accent:#FF6FA8; --accent-ink:#2A0716; --accent-soft:#3D1628}}
:root[data-theme="dark"][data-acc="rojo"]{--accent:#FF5A6E; --accent-ink:#1A0306; --accent-soft:#3A141B}
:root[data-theme="dark"][data-acc="azul"]{--accent:#5C9DFF; --accent-ink:#04122B; --accent-soft:#14243F}
:root[data-theme="dark"][data-acc="morado"]{--accent:#A98BFF; --accent-ink:#150838; --accent-soft:#251A44}
:root[data-theme="dark"][data-acc="rosa"]{--accent:#FF6FA8; --accent-ink:#2A0716; --accent-soft:#3D1628}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--surface)}.sw[aria-pressed="true"]{border-color:var(--ink)}
.pose{display:block;width:100%;max-width:220px;margin:2px auto 10px}

.reto{padding:8px 0;border-bottom:1px solid var(--line)}.reto:last-of-type{border-bottom:0}.reto.ok span:first-child{color:var(--ok)}.reto.warn small{color:var(--warn)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.badge{background:var(--raise);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px}.badge span{font-size:26px}.badge small{font-size:11.5px;line-height:1.2;color:var(--muted)}
.phcmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.phcmp figure{margin:0}.phcmp img{width:100%;border-radius:10px;display:block;aspect-ratio:3/4;object-fit:cover;background:var(--raise)}.phcmp figcaption{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:4px}
.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.htile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}.htile small{color:var(--muted);font-size:13px}.htile b{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1;color:var(--accent)}.htile b i{font-style:normal;font-size:15px;color:var(--ink);margin-left:6px;font-family:inherit}.htile[aria-pressed=true]{border-color:var(--accent)}.htile.lock{opacity:.6}
.kpib{font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface2,rgba(127,127,127,.08));border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpib[aria-pressed=true]{border-color:var(--accent)}.kdet{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}.kbar{display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center}.kbar i{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.kbar em{display:block;height:100%;background:var(--accent)}
.ajlist{display:flex;flex-direction:column;gap:10px}.ajrow{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}.ajic{color:var(--accent);display:flex}.ajtx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.ajtx b{font-weight:700}.ajtx small{color:var(--muted)}.ajch{color:var(--accent);font-size:24px;line-height:1}.pghead{display:flex}
.iacc{padding:0!important;gap:0!important}.iah{display:flex;width:100%;align-items:center;gap:10px;padding:16px 18px;background:none;border:0;text-align:left;color:var(--ink);font:inherit;cursor:pointer}.iah b{font-weight:700;white-space:nowrap}.iah small{flex:1;min-width:0;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.iah i{font-style:normal;font-size:22px;line-height:1;color:var(--muted);transition:transform .2s}.iacc.open .iah i{transform:rotate(90deg)}.iab{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}.iab .iahide{display:none}.rirna{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.dnote{display:flex;gap:8px 10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.dnote .btn{flex:none}.iasub{display:flex;flex-direction:column;gap:10px}.iasub+.iasub{border-top:1px solid var(--line);padding-top:12px}
.askov .card{max-width:380px}.askov h3{font-size:20px}
.shareov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}.shareov .card{max-width:420px;width:100%;max-height:92vh;overflow:auto}.shareov img{width:100%;border-radius:10px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:.02em;margin:0;text-wrap:balance;text-transform:uppercase}
h2{font-size:30px;line-height:1}
h3{font-size:22px;line-height:1.05}
p{margin:0}
.wrap{max-width:760px;margin:0 auto}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.knurl{background-image:repeating-linear-gradient(45deg,transparent 0 5px,rgba(0,0,0,.14) 5px 6px),repeating-linear-gradient(-45deg,transparent 0 5px,rgba(0,0,0,.14) 5px 6px)}

/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap}.brand h1{white-space:nowrap}.status{min-width:0;flex-wrap:nowrap!important}.status .chip.acc{font-size:11.5px;padding:4px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
@media (max-width:520px){.brand h1{font-size:18px!important}.top{padding:8px 0}}
.brand h1{font-size:22px;display:flex;align-items:center;gap:8px;letter-spacing:.06em}
.brand h1 i{width:22px;height:12px;border-radius:3px;background-color:var(--accent);display:inline-block}
.brand h1 em{font-style:normal;color:var(--accent)}
.status{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--ok)}
main{display:flex;flex-direction:column;gap:14px;padding-top:16px}

/* piezas base */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
button.chip{cursor:pointer;padding:8px 14px;font-size:13.5px}
button.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:8px 8px}
.btn.small{padding:7px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.bigbtn{padding:15px;font-size:24px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-display);font-weight:800;width:100%;border-radius:14px}
.big{font-family:var(--font-display);font-size:38px;font-weight:800;line-height:.95;letter-spacing:.01em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.kp4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.kpc{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.kpc .kpi .big{font-size:24px!important}.kpc .kpi span{font-size:10px;letter-spacing:.06em}
.exico{display:flex;gap:8px}.exico .ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink,#111);display:inline-flex;align-items:center;justify-content:center;padding:0;text-decoration:none;flex:none}
.exico .ib{width:auto;border-radius:20px;padding:0 12px 0 10px;gap:6px;height:36px;background:var(--accent-soft);color:var(--ink)}.exico .ib svg{color:var(--accent)}.glb{background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:help;display:inline-flex}.glb:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:999px}.exico{flex-wrap:wrap}@media (max-width:360px){.exico{gap:6px}.exico .ib{padding:0 9px;gap:4px}.exico .ib small{font-size:12px}}.exico .ib small{font-size:13px;font-weight:700;color:inherit}.exico .ib svg{width:18px;height:18px}.exico .ib[aria-expanded=true]{outline:2px solid var(--ink);outline-offset:2px}.kp3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.note{border-left:3px solid var(--accent);background:var(--raise);border-radius:0 10px 10px 0;padding:8px 12px;color:var(--muted);font-size:13.5px}
.note.warn{border-color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
details summary{cursor:pointer;font-weight:700}
.pfsec>summary{list-style:none;display:flex;align-items:center;gap:8px;font-size:16px;padding:4px 0}
.pfsec>summary::-webkit-details-marker{display:none}
.pfsec>summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.pfsec[open]>summary::after{transform:rotate(-135deg)}
.pfsec[open]>summary{margin-bottom:12px}
#pfcard .pfsec{border-top:1px solid var(--line);padding-top:12px}
.path{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.pathbar{display:flex;gap:4px}.pathbar i{flex:1;height:8px;border-radius:4px;background:var(--chip)}.pathbar i.done{background:var(--accent-soft)}.pathbar i.cur{background:var(--accent)}
.sets input.auto{color:var(--accent);font-style:italic}
.effh .effseg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.hdq{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer}.hdq span{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--chip);font-size:10px;margin-left:2px}
.glo{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0}@media (max-width:520px){.glo{grid-template-columns:1fr;gap:2px}.glo dd{margin-bottom:10px}}.glo dt{font-weight:700}.glo dd{margin:0;color:var(--muted)}
.seedrow{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}.seedrow b{color:var(--ink)}.seedrow input{flex:1;min-width:0}
.addpick{border:1px solid var(--line);border-radius:14px;padding:12px}
.addlist{display:flex;flex-direction:column;max-height:360px;overflow:auto}
.addrow{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 2px;color:var(--ink);cursor:pointer}
.addrow span:first-child{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.addrow small{color:var(--muted);font-size:12px;line-height:1.35}
.addrow .plus{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--chip);font-weight:700}
.chips-scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chips-scroll .chip{flex:none}
.warnline{color:var(--warn,#d9a13b)}
.bandsel{min-width:0;width:100%}
.qseed{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.credit{display:block;margin:8px auto 4px;background:none;border:0;color:var(--muted);font-size:12px;opacity:.75;padding:8px}

/* formularios */
input[type=number],input[type=text],input[type=search],input[type=date],input[type=email],input[type=password],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
textarea{min-height:64px;resize:vertical}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:5px}
label.inline{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:14px}
label.inline input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.fld{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.scale{display:flex;gap:6px;flex-wrap:wrap}
.scale button{min-width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.scale button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

[hidden]{display:none!important}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--raise);font-weight:700;font-size:16px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt::after{content:"›";color:var(--muted);font-size:20px}
span.seg{display:block}
.qk{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-weight:800;font-size:18px;color:var(--muted);padding:0}
.qk.on{background:var(--ok);border-color:var(--ok);color:#04210F}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:17;width:min(560px,calc(100vw - 24px));background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
body:has(.savebar) .toast{bottom:calc(152px + env(safe-area-inset-bottom,0px))}
.savebar span{flex:1;font-weight:700;font-size:14px}
.savebar .btn.ghost{color:inherit;opacity:.8}
.saved{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:700;font-size:13px}
.swapsel{display:flex;flex-direction:column;gap:8px}
.swapsel select{font-weight:600}
.rank{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.rank b{color:var(--ink)}
/* navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted);font-size:11px;font-weight:700;flex:1;max-width:92px;border-radius:12px}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-selected="true"]{color:var(--accent)}
.nav button.main{color:var(--ink)}
.nav button.main span{width:58px;height:58px;margin-top:-28px;border-radius:50%;background-color:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:5px solid var(--bg)}
.nav button.main svg{width:26px;height:26px;stroke-width:2.4}
.nav button.main[aria-selected="true"]{color:var(--accent)}

/* inicio */
.greet h2{font-size:36px}
.today{background-color:var(--accent);color:var(--accent-ink);border:0;position:relative;overflow:hidden}

function csvParse(t){const R=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','||c===';'&&!t.slice(0,200).includes(',')){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);R.push(r);r=[];f=''}else f+=c}if(f||r.length){r.push(f);R.push(r)}return R.filter(x=>x.length>1)}

  else if(ix('exercise name')>=0){fmtN='Strong';get=r=>({w:r[ix('workout name')]||'Entrenamiento',d:r[ix('date')],ex:r[ix('exercise name')],kg:(+r[ix('weight')]||0)*(unit==='lb'?.4536:1),reps:+r[ix('reps')]||0,secs:+r[ix('seconds')]||0,rpe:+r[ix('rpe')]||null,t:''})}
  else return{err:'No reconozco el formato de este archivo. Exporta tu historial como CSV desde la app donde entrenabas.'};
  const by=new Map(),miss=new Map();let nset=0;rows.slice(1).forEach(r=>{const x=get(r);if(!x.ex||!x.d)return;const key=String(x.ex).trim().toLowerCase(),id=IMPMAP[key]||IMPMAP[key.replace(/\s*\(.*\)\s*/,'')];if(!id||!EXM[id]){miss.set(x.ex,(miss.get(x.ex)||0)+1);return}
    const ts=Date.parse(String(x.d).replace(' ','T'))||Date.parse(x.d);if(!ts)return;const sk=x.d+'|'+x.w;if(!by.has(sk))by.set(sk,{ts,w:x.w,exs:new Map()});const ss=by.get(sk);if(!ss.exs.has(id))ss.exs.set(id,[]);
    const ex=EXM[id],reps=ex.u==='s'?Math.round(x.secs):Math.round(x.reps);if(!(reps>0))return;const kg=Math.max(0,Math.round((ex.bwf?Math.max(0,x.kg):x.kg)*4)/4);
    ss.exs.get(id).push({kg,reps,rir:x.rpe?clamp(Math.round(10-x.rpe),0,5):2,t:x.t==='warmup'?'w':'n'});nset++});
  const have=new Set(S.sessions.map(s=>Math.round(s.ts/6e4)));let added=0;
  [...by.values()].sort((a,b)=>a.ts-b.ts).forEach(ss=>{if(have.has(Math.round(ss.ts/6e4)))return;const exs=[...ss.exs.entries()].map(([id,sets])=>({id,n:EXM[id].n,m:EXM[id].m,sets})).filter(e=>e.sets.length);if(!exs.length)return;
    const s={id:uid(),ts:ss.ts,meso:0,week:0,deload:false,day:-1,dayName:ss.w,exs,imported:fmtN,prs:[]};S.sessions.push(s);try{Store.saveSession(s)}catch(e){}added++});
  return{fmtN,added,nset,miss:[...miss.entries()].sort((a,b)=>b[1]-a[1])}}

function hrZ(){const p=S.profile;if(p.bbloq)return null;const a=+p.edad,mx=+p.fcmax||(a>=12&&a<=90?Math.round(208-.7*a):0);if(!mx)return null;
  const r=+p.fcrep,kv=r>=35&&r<mx-40,z=(lo,hi,klo,khi)=>kv?[Math.round(r+(mx-r)*lo),Math.round(r+(mx-r)*hi)]:[Math.round(mx*klo),Math.round(mx*khi)];

function bwTrend(){const B=S.body.filter(b=>b.ts>Date.now()-21*864e5);if(B.length<3)return null;const h=Math.floor(B.length/2),a=B.slice(0,h),b=B.slice(h);

function cardioPlan(){const p=S.profile,g=p.cardio;if(!g||g==='no')return null;
  let n={salud:2,grasa:2,resis:3}[g]||2,min={salud:25,grasa:30,resis:30}[g]||25,inter=g==='resis'?1:0;const why=[];
  const fp=hasD('fisico')?compPhase('fisico'):null,prep=fp&&(fp.k==='prep'||fp.k==='prep2');

  if((g==='grasa'||prep)&&tr!=null&&tr>-.25){n=Math.min(n+1,4);min=Math.min(min+10,45);why.push('Tu peso casi no ha bajado en las últimas semanas, así que subimos un poco.')}

const weekSessions=()=>S.sessions.filter(s=>s.meso===S.meso.number&&s.week===S.meso.week);

function applyReview(rev){

/* ───────── motor: estancamiento ───────── */
function stalls(){
  const win=S.params.stallWeeks,out=[];
  const recent=S.reviews.slice(-4);
  const fat=mean(recent.map(r=>r.fatigue).filter(Number.isFinite)),sl=mean(recent.map(r=>r.sleep).filter(Number.isFinite));
  const tired=(recent.length&&fat>=3.5)||(recent.length&&sl>0&&sl<7);
  EX.forEach(ex=>{
    const H=exHistory(ex.id).filter(h=>h.s.gw>=S.gw-win);
    const gws=[...new Set(H.map(h=>h.s.gw))];
    if(gws.length<Math.ceil(win*.6))return;
    const half=S.gw-win/2;
    const early=Math.max(0,...H.filter(h=>h.s.gw<half).flatMap(h=>h.sets.map(x=>e1rm(x.kg,x.reps,x.rir))));
    const late=Math.max(0,...H.filter(h=>h.s.gw>=half).flatMap(h=>h.sets.map(x=>e1rm(x.kg,x.reps,x.rir))));
    if(early&&late&&late<=early*1.005)out.push({id:ex.id,m:ex.m,early,late,advice:tired?'down':'up'});
  });
  return out;
}

/* ───────── datos de ejemplo (usa el mismo motor) ───────── */

    const plan=buildWeek(),stress=(S.meso.number===1&&S.meso.week>=5&&!S.meso.deload);
    plan.days.forEach(day=>{
      const exs=day.items.map(it=>{
        const sg=suggest(it),kg=sg?sg.kg:EXM[it.exId].kg;
        const sets=[];
        for(let k=0;k<it.sets;k++){

        fb:{sleep:stress?6.1:7.2+rnd()*.6,fatigue:Math.round(ft),mot:stress?2:4,joints:1,perf:stress?2:4,notes:'',mu:Object.fromEntries([...new Set(day.items.map(i=>i.muscle))].map(mq=>[mq,stress?{pump:2,sore:3,load:3}:(S.meso.number===1&&S.meso.week<=2)?{pump:1,sore:1,load:1}:{pump:2,sore:2,load:2}]))}});

/* ───────── demostración animada de la técnica (figura propia) ───────── */
const V=(x,y)=>({x,y});

const rad=d=>d*Math.PI/180;

  const e=V(a.x+Math.cos(ang)*d,a.y+Math.sin(ang)*d),mid=mix(a,e,.5);
  let best=null,bs=-1e9;
  [1,-1].forEach(sg=>{const th=ang+sg*a1,j=V(a.x+Math.cos(th)*l1,a.y+Math.sin(th)*l1),sc=(j.x-mid.x)*pref.x+(j.y-mid.y)*pref.y;if(sc>bs){bs=sc;best=j}});
  return{j:best,e};

/* formas: miembro con extremos redondeados y grosor variable */
function capd(a,b,w1,w2){

  const P=(p,n,r)=>f1(p.x+n*nx*r)+' '+f1(p.y+n*ny*r);
  return `M${P(a,1,r1)} L${P(b,1,r2)} A${r2} ${r2} 0 0 0 ${P(b,-1,r2)} L${P(a,-1,r1)} A${r1} ${r1} 0 0 0 ${P(a,1,r1)}Z`;
}
function torsoD(hip,sh,facing,fp,bp){
  const dx=sh.x-hip.x,dy=sh.y-hip.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy*facing,ny=ux*facing;

    <div class="tablewrap"><table><thead><tr><th>Músculo</th><th>Plan</th><th>Hechas</th><th>Decisión</th></tr></thead><tbody>
    ${r.decisions.map(d=>`<tr><td>${esc(MN[d.m])}</td><td>${d.planned}</td><td>${fmt(d.got)}</td><td class="wrapcell">${esc(d.txt)}</td></tr>`).join('')}</tbody></table></div>

/* — Programa — */
function viewPrograma(){
  const plan=buildWeek(),ss=weekSessions(),vd=volumeDone(ss),done=S.profile.metodo==='fraccional'?vd.f:vd.d,dd=new Set(ss.map(x=>x.day));
  const kind=S.profile.disc==='cali'?'cali':(S.profile.disc==='fisico'||S.profile.disc==='general')?'hyp':null,SL=kind?splitList(kind):null,cur=kind?splitOf(kind):null;
  let h=`<section class="card stack"><div class="row between"><div><span class="eyebrow">${esc(plan.split)}</span><h2>Tu plan</h2></div><button class="btn ghost small" data-act="go" data-v="inicio">Volver</button></div>
    ${kind?`<label>Distribución de ${discs().length>1?'tus '+primDays()+' días de '+esc(DISC[S.profile.disc].toLowerCase()):'los '+S.profile.dias+' días'}<select id="split-sel" data-kind="${kind}">${SL.map((o,j)=>`<option value="${o.id}" ${o===cur?'selected':''}>${esc(o.n)}${j===0?' · recomendado':''}</option>`).join('')}</select></label>
    <p class="muted small">${esc(cur.w)}${cur!==SL[0]?' La recomendada para ti es '+esc(SL[0].n.toLowerCase())+'.':''}</p>`:`<p class="muted small">En ${esc(discs().filter(x=>x==='power'||x==='street').map(x=>DISC[x].toLowerCase()).join(' y '))} la distribución sigue la frecuencia de los levantamientos de competencia y está organizada según tus días.</p>`}
    ${ladder()}</section>
    <section class="card stack"><h3>Series de la semana por músculo</h3>
    ${MUSCLES.map(mu=>{const p=plan.perMuscle[mu.id];if(!p)return '';const got=done[mu.id]||0,pc=clamp(got/p.weekly*100,0,100);
      return `<div class="mrow"><div><b>${esc(mu.n)}</b> ${p.spec?'<span class="chip acc">prioridad</span>':''} ${p.over?'<span class="chip bad">mucho por sesión</span>':''}<br><small>${p.freq} ${p.freq===1?'vez':'veces'} por semana · ${p.per} por sesión${REGC[mu.id]?(()=>{const rs=[...new Set(plan.days.flatMap(d=>d.items).filter(i=>i.muscle===mu.id).map(i=>regOf(EXM[i.exId])))].filter(Boolean);return rs.length?'<br>Cubre: '+rs.map(r=>esc(mu.id==='triceps'&&r==='lat'?REGN.lat2:REGN[r])).join(', '):''})():''}</small></div><b class="num">${fmt(got)} / ${p.weekly}</b><div class="bar ${pc>=100?'ok':''}"><i style="width:${pc}%"></i></div></div>`}).join('')}
    ${Object.values(plan.perMuscle).some(p=>p.over)?'<div class="note warn">Algunos músculos tienen demasiadas series por sesión. Aumenta los días de entrenamiento en Perfil para repartirlas mejor.</div>':''}</section>`;

function viewLib(){

const DK=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

function viewHist(){

  sel.forEach(x=>{h+=viewSessSummary(x)});
  return h;
}

/* — Progreso — */
function lineChart(pts,unit,msg){
  if(pts.length<2)return `<div class="empty">${msg||'Hacen falta al menos 2 sesiones de este ejercicio para dibujar la curva.'}</div>`;
  const W=640,H=230,pl=48,pr=14,pt=14,pb=28;
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);const pad=(hi-lo)*.2||2;lo-=pad;hi+=pad;
  const X=i=>pl+(W-pl-pr)*(i/(pts.length-1)),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const ticks=[0,1,2,3].map(i=>lo+(hi-lo)*i/3);
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del 1RM estimado">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${(Y(t)+4).toFixed(1)}" text-anchor="end">${(hi-lo)<8?fmt(Math.round(t*10)/10):Math.round(t)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i===pts.length-1?5:2.6}" fill="var(--accent)"/>`).join('')}
    <text x="${X(pts.length-1)}" y="${Y(last.y)-10}" text-anchor="end" style="fill:var(--ink);font-weight:600">${fmt(last.y)}${unit==null?' '+U():unit}</text>
    <text x="${pl}" y="${H-8}">${esc(pts[0].l)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${esc(last.l)}</text></svg>`;
}
const RNG=[['7','7 días'],['28','4 semanas'],['90','3 meses'],['180','6 meses'],['365','1 año']];

const barsH=(items,sel,det)=>{const mx=Math.max(...items.map(i=>Math.max(i.v,i.t||0)),1);return `<div class="hb">${items.map(i=>`<${det?`button data-act="volsel" data-v="${i.id}" aria-expanded="${sel===i.id}"`:'div'} class="hbr"><span>${esc(i.n)}</span><div class="bar"><i style="width:${(i.v/mx*100).toFixed(0)}%"></i>${i.t?`<u style="left:${(i.t/mx*100).toFixed(0)}%" title="Objetivo"></u>`:''}</div><b class="num">${fmt(Math.round(i.v*10)/10)}</b></${det?'button':'div'}>${det&&sel===i.id?det(i.id):''}`).join('')}</div>`};

}
