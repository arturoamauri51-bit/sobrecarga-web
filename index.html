<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sobrecarga</title>
<meta name="theme-color" content="#0B0D10">
<style>
:root{--bg:#0B0D10;--card:#14181D;--line:#262C33;--ink:#F1EEE8;--mut:#9AA3AD;--acc:#FF7A3D}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;place-items:center;padding:16px}
.card{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 26px;text-align:center}
.logo{font-weight:800;letter-spacing:.12em;color:var(--acc);font-size:14px}
h1{font-size:26px;margin:14px 0 10px}
p{margin:0;color:#C9C5BE}
.mut{margin-top:18px;font-size:14px;color:var(--mut)}
a{color:var(--acc)}
</style>
</head>
<body>
<main class="card">
  <div class="logo">SOBRECARGA</div>
  <h1 id="t">Correo confirmado</h1>
  <p id="m">Ya puedes volver a la app y entrar con tu correo y contraseña.</p>
  <p class="mut">¿Dudas? <a href="mailto:sobrecargasoporte@gmail.com">sobrecargasoporte@gmail.com</a></p>
</main>
<script>
(function(){var h=location.hash+location.search;
if(/error/.test(h)){document.getElementById('t').textContent='El enlace ya no es válido';document.getElementById('m').textContent='Puede que ya lo hayas usado o que haya caducado. Vuelve a la app e intenta entrar; si no puedes, pide otro correo desde ahí.';}
else if(/type=recovery/.test(h)){document.getElementById('t').textContent='Vuelve a la app';document.getElementById('m').textContent='Para cambiar tu contraseña, usa el código que te llegó por correo dentro de la app.';}
if(location.hash)history.replaceState(null,'',location.pathname);})();
</script>
</body>
</html>
